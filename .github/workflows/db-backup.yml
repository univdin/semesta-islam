name: Database Backup (Supabase)

on:
  schedule:
    # Weekly on Sunday 03:30 UTC
    - cron: "30 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pg_dump 17 (match Supabase server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump Supabase database (session pooler)
        run: |
          /usr/lib/postgresql/17/bin/pg_dump \
            --host=aws-0-ap-northeast-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.dlpzffnqjjuumnljedor \
            --dbname=postgres \
            --no-owner --no-acl \
            --format=custom \
            --file="semestaislam-$(date +%Y%m%d-%H%M%S).dump"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Create GitHub Release with backup
        uses: softprops/action-gh-release@v2
        with:
          tag_name: db-backup-${{ github.run_id }}
          name: Database Backup ${{ github.run_number }}
          files: semestaislam-*.dump
          fail_on_unmatched_files: false
          generate_release_notes: false
