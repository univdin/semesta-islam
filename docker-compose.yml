services:
  db:
    image: postgres:16-alpine
    container_name: semestaislam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: placeholder
      POSTGRES_DB: semestaislam
    ports:
      - "5432:5432"
    volumes:
      - semestaislam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semestaislam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  semestaislam_pgdata:
