<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D2E"/>
      <stop offset="60%" stop-color="#09271D"/>
      <stop offset="100%" stop-color="#04120D"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B89428"/>
    </linearGradient>
    <pattern id="islamicGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.07"/>
      <circle cx="30" cy="30" r="12" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#islamicGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="1050" cy="120" r="280" fill="#D4AF37" opacity="0.12" filter="blur(80px)"/>
  <circle cx="150" cy="500" r="320" fill="#16533F" opacity="0.3" filter="blur(90px)"/>

  <!-- Outer Fine Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="url(#goldText)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Brand Symbol (Left Side) -->
  <g transform="translate(140, 315)">
    <!-- Outer Shield Container -->
    <rect x="-80" y="-80" width="160" height="160" rx="36" fill="#0F3D2E" stroke="url(#goldText)" stroke-width="3"/>
    
    <!-- Rub el Hizb Geometric Motif -->
    <g transform="scale(0.35)">
      <rect x="-150" y="-150" width="300" height="300" rx="20" fill="none" stroke="url(#goldText)" stroke-width="8" opacity="0.6" />
      <rect x="-150" y="-150" width="300" height="300" rx="20" fill="none" stroke="url(#goldText)" stroke-width="8" transform="rotate(45)" opacity="0.6" />
      <path d="M-80 55 Q-35 25 0 55 Q35 25 80 55 Q45 80 0 68 Q-45 80 -80 55 Z" fill="url(#goldText)"/>
      <path d="M0 -105 L15 -35 L75 -65 L32 -15 L85 12 L18 22 L32 80 L-10 32 L-52 68 L-32 10 L-85 -10 L-22 -20 L-45 -65 L0 -35 Z" fill="url(#goldText)"/>
    </g>
  </g>

  <!-- Content Block (Right Side) -->
  <g transform="translate(260, 0)">
    <!-- Badge -->
    <g transform="translate(0, 150)">
      <rect width="360" height="36" rx="18" fill="rgba(212, 175, 55, 0.15)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#10B981"/>
      <text x="36" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F3E5AB" letter-spacing="1">VERIFIKASI LAJNAH KREDENSIAL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="245" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      SEMESTA <tspan fill="url(#goldText)">ISLAM</tspan>
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="315" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#E2E8F0">
      Platform Edukasi & Pendidik Islam Terverifikasi
    </text>

    <text x="0" y="365" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" width="750">
      <tspan x="0" dy="0">Menghubungkan keluarga pembelajar dengan Ustaz, Ustazah, dan Lembaga</tspan>
      <tspan x="0" dy="28">yang kredensial & sanad keilmuannya diverifikasi secara ilmiah & transparan.</tspan>
    </text>

    <!-- Trust Feature Chips -->
    <g transform="translate(0, 460)">
      <!-- Chip 1 -->
      <g>
        <rect width="180" height="42" rx="21" fill="rgba(15, 61, 46, 0.8)" stroke="rgba(255, 255, 255, 0.15)"/>
        <text x="24" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">📜 Sanad Valid</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(195, 0)">
        <rect width="210" height="42" rx="21" fill="rgba(15, 61, 46, 0.8)" stroke="rgba(255, 255, 255, 0.15)"/>
        <text x="24" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">🛡️ Verifikasi 4-Lapis</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(420, 0)">
        <rect width="210" height="42" rx="21" fill="rgba(15, 61, 46, 0.8)" stroke="rgba(255, 255, 255, 0.15)"/>
        <text x="24" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">🏡 Belajar Privat & Online</text>
      </g>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="555" font-family="'JetBrains Mono', monospace, sans-serif" font-size="16" font-weight="600" fill="#D4AF37" opacity="0.85">
      semesta-islam.vercel.app
    </text>
  </g>
</svg>
